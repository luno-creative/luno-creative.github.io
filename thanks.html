<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#101b2a">
  <title>お問い合わせありがとうございます｜LUNO CREATIVE</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f5ef;color:#101b2a;font-family:Inter,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.8}
    main{width:min(100%,620px);padding:clamp(28px,6vw,58px);background:#fffefa;border:1px solid #e4e5de;border-radius:16px;text-align:center;box-shadow:0 18px 55px #101b2a12}
    .logo{font-size:18px;font-weight:850;letter-spacing:.13em}.logo span{color:#78a936}
    .check{width:64px;height:64px;display:grid;place-items:center;margin:32px auto 20px;border-radius:50%;background:#edf4e4;color:#52752c;font-size:32px;font-weight:800}
    h1{font-size:clamp(25px,5vw,34px);line-height:1.4;margin:0 0 14px}
    p{font-size:15px;color:#66717d;margin:0 auto 14px}
    .notice{margin:26px 0;padding:16px;border-radius:8px;background:#f6f7f2;font-size:13px;color:#56616a;text-align:left}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:6px;background:#b9e66a;color:#101b2a;text-decoration:none;font-size:14px;font-weight:800}
    a:hover{filter:brightness(1.04)}
    footer{margin-top:28px;font-size:11px;color:#8a939a}
  </style>
</head>
<body>
  <main>
    <div class="logo">LUNO<span>.</span></div>
    <div class="check" aria-hidden="true">✓</div>
    <h1>お問い合わせ<br>ありがとうございます。</h1>
    <p>メッセージを受け付けました。</p>
    <p>内容を確認のうえ、担当者よりご連絡いたします。</p>
    <div class="notice">受付確認メールを、ご入力いただいたメールアドレス宛にお送りしています。メールが届かない場合は、迷惑メールフォルダもご確認ください。</div>
    <a href="https://luno-creative.github.io/">公式サイトに戻る</a>
    <footer>© 2026 LUNO CREATIVE</footer>
  </main>
</body>
</html>
